<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </radialGradient>
    <radialGradient id="craterGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glow halo -->
  <circle cx="50" cy="50" r="44" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
  <!-- Lunar body -->
  <circle cx="50" cy="50" r="42" fill="url(#moonGrad)"/>
  <!-- Craters -->
  <circle cx="34" cy="38" r="8" fill="url(#craterGrad)"/>
  <circle cx="62" cy="32" r="6" fill="url(#craterGrad)"/>
  <circle cx="48" cy="65" r="11" fill="url(#craterGrad)"/>
  <circle cx="68" cy="62" r="7" fill="url(#craterGrad)"/>
  <circle cx="28" cy="62" r="5" fill="url(#craterGrad)"/>
  <!-- South pole crosshair target -->
  <circle cx="50" cy="80" r="4" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="50" y1="73" x2="50" y2="87" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="43" y1="80" x2="57" y2="80" stroke="#a855f7" stroke-width="1.5"/>
</svg>
